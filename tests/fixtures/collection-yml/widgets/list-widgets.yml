info:
  name: List widgets
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/widgets?country=NL"
  params:
    - name: country
      value: NL
      type: query
      description: ISO 3166-1 alpha-2
    - name: limit
      value: "50"
      type: query
      description: max 500
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Lists widgets for one country.
